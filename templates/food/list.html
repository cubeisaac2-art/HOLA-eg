{% extends 'base.html' %}
{% block title %}Comidas | HOLA GUINEA{% endblock %}
{% block content %}
<section class="py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Comidas típicas</h1>
    </div>

    <form method="get" class="card shadow-sm border-0 mb-4">
        <div class="card-body row g-3 align-items-end">
            <div class="col-md-5">
                <label class="form-label">Búsqueda</label>
                <input name="q" value="{{ query }}" class="form-control" placeholder="Buscar por nombre o descripción">
            </div>
            <div class="col-md-5">
                <label class="form-label">Ciudad</label>
                <input name="city" value="{{ city }}" class="form-control" placeholder="Ej. Malabo, Bata">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" type="submit">Filtrar</button>
            </div>
        </div>
    </form>

    <div class="row g-4">
        {% for item in items %}
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <img src="{{ url_for('static', filename='uploads/' + item.image) }}" class="card-img-top" alt="{{ item.name }}" style="height: 220px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5>{{ item.name }}</h5>
                        <p class="text-muted">{{ item.city }}</p>
                        <p>{{ item.description }}</p>
                        <div class="mt-auto">
                            <a class="btn btn-primary btn-sm" href="{{ url_for('food_detail', item_id=item.id) }}">Ver detalle</a>
                        </div>
                    </div>
                </div>
            </div>
        {% else %}
            <div class="col-12">
                <div class="alert alert-info">No hay resultados para esta búsqueda.</div>
            </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
