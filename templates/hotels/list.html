{% extends 'base.html' %}
{% block title %}Hoteles | HOLA GUINEA{% endblock %}
{% block content %}
<section class="py-4">
    <h1 class="mb-4">Hoteles</h1>
    <div class="row g-4">
        {% for item in items %}
            <div class="col-md-4">
                <div class="card shadow-sm border-0 h-100">
                    <img src="{{ url_for('static', filename='uploads/' + item.image) }}" class="card-img-top" alt="{{ item.name }}" style="height: 220px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5>{{ item.name }}</h5>
                        <p class="text-muted">{{ item.city }} · {{ item.stars }} estrellas</p>
                        <p>{{ item.description }}</p>
                        <div class="mt-auto">
                            <a class="btn btn-primary btn-sm" href="{{ url_for('hotel_detail', item_id=item.id) }}">Ver detalle</a>
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
